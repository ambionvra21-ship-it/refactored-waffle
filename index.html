<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Workspace</title><link rel="stylesheet" href="styles.css"><script src="https://jsdelivr.net"></script></head><body><div class="app-container"><nav class="sidebar"><h2>V-1 Tools</h2><ul><li><a href="#" class="active" data-target="exp">Expense Tracker</a></li><li><a href="#" data-target="snip">Snippets</a></li></ul><h2>V-2 Dev</h2><ul><li><a href="#" data-target="json">JSON Viewer</a></li><li><a href="#" data-target="regex">Regex Tester</a></li></ul></nav><main class="content-area">
<section id="exp" class="panel active"><h3>Expense Tracker</h3><form id="exp-form"><input type="text" id="desc" placeholder="Desc" required><input type="number" id="amt" placeholder="Amt" required><button type="submit">Add</button></form><canvas id="chart" style="max-height:150px;"></canvas><ul id="exp-list"></ul></section>
<section id="snip" class="panel"><h3>Snippets</h3><textarea id="snip-in" placeholder="Text..."></textarea><button onclick="saveSnip()">Save</button><div id="snip-list"></div></section><section id="json" class="panel"><h3>JSON Viewer</h3><textarea id="json-in" placeholder="Raw JSON"></textarea><button onclick="viewJSON()">Format</button><pre id="json-out"></pre></section>
<section id="regex" class="panel"><h3>Regex Tester</h3><input type="text" id="rx-pat" placeholder="Pattern"><input type="text" id="rx-str" placeholder="String"><button onclick="testRx()">Test</button><p id="rx-out"></p></section></main></div><script src="app.js"></script></body></html>
